name: Bug report
description: Something in the app does not work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.

        Do not report security vulnerabilities here. Use the repository's private vulnerability reporting instead (see SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe what you saw. Include any error message shown in the app.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The shortest list of steps that shows the problem, starting from launching the app.
      placeholder: |
        1. Open the tab …
        2. Tap …
        3. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version or commit
      description: The commit you built from (`git rev-parse --short HEAD`), or the app version.
      placeholder: e.g. a1b2c3d
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: iOS version and device or simulator
      placeholder: e.g. iOS 18.2, iPhone 16 simulator
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots (optional)
      description: Drag images or a short screen recording into this field.
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Before you submit
      options:
        - label: I removed API keys and personal data from anything I attached.
          required: true
